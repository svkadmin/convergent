# Apply after browser-base; preserve private state across updates.
config:
  environment.BROWSER_ROLE: "web"
  # Static address is selected by browser-setup.
  security.protection.delete: "true"
  limits.memory: 2GiB
description: Convergent web browser
devices:
  eth0:
    type: nic
    nictype: bridged
    parent: web
    name: eth0
    hwaddr: "00:16:3e:80:03:10"
    ipv4.address: 100.80.3.10
    security.ipv4_filtering: "true"
    security.mac_filtering: "true"
    security.port_isolation: "true"
  wayland:
    type: disk
    source: /run/convergent/browser/web/wayland-0
    path: /mnt/browser/wayland-0
    readonly: "true"
    required: "true"
  pipewire:
    type: disk
    source: /run/convergent/browser/web/pipewire-0
    path: /mnt/browser/pipewire-0
    readonly: "true"
    required: "true"
  state:
    type: disk
    pool: default
    source: browser-web-state
    path: /home/browser
