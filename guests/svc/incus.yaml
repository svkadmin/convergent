# ARCHITECTURE 3.4, 4.2
# Create persistent svc-{metrics,logs,grafana} volumes (2GiB/6GiB/512MiB).
# First boot installs root:SERVICE 0640 credentials from CVSEED.
# Incus client: type=metrics, server SAN DNS:host.
# Syslog server SAN: IP:100.80.2.10, DNS:svc; senders verify the CA/SAN.
# grafana raises the idle 350MiB cap to 768MiB while viewed.
config:
  security.privileged: "false"
  security.nesting: "false"
  # Nested subvolumes escape the container's qgroup. Masked: the kernel reads only the low 32 bits.
  security.syscalls.deny: |
    ioctl errno 1 [1,0x50009401,SCMP_CMP_MASKED_EQ,0xffffffff]
    ioctl errno 1 [1,0x5000940e,SCMP_CMP_MASKED_EQ,0xffffffff]
    ioctl errno 1 [1,0x50009417,SCMP_CMP_MASKED_EQ,0xffffffff]
    ioctl errno 1 [1,0x50009418,SCMP_CMP_MASKED_EQ,0xffffffff]
  security.guestapi: "false"
  # The host default arp_ignore=8 reaches container interfaces; the firewalls need ARP replies.
  linux.sysctl.net.ipv4.conf.eth0.arp_ignore: "0"
  security.protection.delete: "true"
  limits.cpu: "1"
  limits.memory: 350MiB
  limits.memory.swap: "false"
  limits.processes: "256"
  boot.autostart: "true"
  boot.autorestart: "true"
description: svc (unprivileged Alpine 3.24)
devices:
  root:
    type: disk
    path: /
    pool: default
    size: 2GiB
  metrics:
    type: disk
    pool: default
    source: svc-metrics
    path: /var/lib/victoria-metrics
  logs:
    type: disk
    pool: default
    source: svc-logs
    path: /var/lib/victoria-logs
  grafana:
    type: disk
    pool: default
    source: svc-grafana
    path: /var/lib/grafana
  eth0:
    type: nic
    nictype: bridged
    parent: svc
    name: eth0
    hwaddr: 00:16:3e:80:02:10
    ipv4.address: 100.80.2.10
    security.ipv4_filtering: "true"
    security.mac_filtering: "true"
    security.port_isolation: "true"
