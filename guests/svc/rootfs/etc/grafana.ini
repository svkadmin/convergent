[paths]
data = /var/lib/grafana
plugins = /usr/share/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 100.80.2.10
http_port = 3000
domain = svc
root_url = http://100.80.2.10:3000/
enable_gzip = true

[security]
data_source_proxy_whitelist = 127.0.0.1:8427
admin_user = owner
admin_password = $__file{/etc/grafana/admin-password}
secret_key = $__file{/etc/grafana/secret-key}
disable_gravatar = true
cookie_samesite = strict
allow_embedding = false
content_security_policy = true

[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 12h
login_maximum_lifetime_duration = 7d

[auth.anonymous]
enabled = false

[auth.basic]
enabled = false

[users]
default_theme = dark
allow_sign_up = false
allow_org_create = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
public_key_retrieval_disabled = true
allow_loading_unsigned_plugins =

[unified_alerting]
enabled = false

[alerting]
enabled = false

[log]
mode = console
level = warn

[live]
max_connections = 0

[news]
news_feed_enabled = false
