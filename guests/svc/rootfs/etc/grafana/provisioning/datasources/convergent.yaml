apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: metrics
    type: prometheus
    access: proxy
    url: http://127.0.0.1:8427
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      prometheusType: Prometheus
  - name: VictoriaLogs
    uid: logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://127.0.0.1:8427
    editable: false
    jsonData:
      maxLines: "100"
