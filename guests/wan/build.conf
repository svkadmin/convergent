# WAN build settings and paths.

# Two-letter regulatory country, required.
WAN_COUNTRY=${WAN_COUNTRY:-}

# Sparse disk size.
IMAGE_SIZE=${IMAGE_SIZE:-1G}

# Where the bootstrap is cached and where the image is written.
CACHE_DIR=${CACHE_DIR:-/var/cache/convergent/alpine}
OUT_DIR=${OUT_DIR:-/var/lib/convergent/out/wan}
