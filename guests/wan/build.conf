# WAN build pins and paths.

# Signed packages from this branch.
ALPINE_BRANCH=${ALPINE_BRANCH:-v3.24}
ALPINE_MIRROR=${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}

# Pin the bootstrap hash after verifying Alpine's signature.
MINIROOTFS=${MINIROOTFS:-alpine-minirootfs-3.24.0-x86_64.tar.gz}
MINIROOTFS_SHA256=${MINIROOTFS_SHA256:-unset}

# Two-letter regulatory country, required.
WAN_COUNTRY=${WAN_COUNTRY:-}

# Host's SSH public key and svc's syslog CA.
HOST_SSH_PUBKEY_FILE=${HOST_SSH_PUBKEY_FILE:-}
SVC_CA_FILE=${SVC_CA_FILE:-}

# Sparse disk size.
IMAGE_SIZE=${IMAGE_SIZE:-1G}

# Where the bootstrap is cached and where the image is written.
CACHE_DIR=${CACHE_DIR:-/var/cache/convergent/alpine}
OUT_DIR=${OUT_DIR:-/var/lib/convergent/out/wan}
