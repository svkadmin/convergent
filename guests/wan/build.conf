# Convergent wan: what the image is built from. Changing a pin is a deliberate, reviewed act.
# Every value may be overridden from the environment (the build host's own settings).

# Alpine release and mirror. The packages are the branch's current ones, signature-checked by
# apk against the keys inside the minirootfs below; the build records the versions it got.
ALPINE_BRANCH=${ALPINE_BRANCH:-v3.24}
ALPINE_MIRROR=${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}

# The bootstrap: Alpine's minirootfs for that release. Its SHA-256 (from alpinelinux.org/downloads,
# checked against the .asc signature when the pin is set) is the root of trust for the build.
MINIROOTFS=${MINIROOTFS:-alpine-minirootfs-3.24.0-x86_64.tar.gz}
MINIROOTFS_SHA256=${MINIROOTFS_SHA256:-unset}

# Regulatory country, two letters. No default: a wrong one is a legal and a radio problem.
WAN_COUNTRY=${WAN_COUNTRY:-}

# The host's SSH public key (ssh-ed25519) that may manage wan, and svc's syslog CA (PEM).
HOST_SSH_PUBKEY_FILE=${HOST_SSH_PUBKEY_FILE:-}
SVC_CA_FILE=${SVC_CA_FILE:-}

# Disk size (sparse), and which iwlwifi firmware files to keep. Empty keeps the whole
# linux-firmware-intel package; otherwise a list of globs, e.g. "iwlwifi-bz-* iwlwifi-gl-*".
IMAGE_SIZE=${IMAGE_SIZE:-1G}
IWLWIFI_FW_KEEP=${IWLWIFI_FW_KEEP:-}

# Where the bootstrap is cached and where the image is written.
CACHE_DIR=${CACHE_DIR:-/var/cache/convergent/alpine}
OUT_DIR=${OUT_DIR:-/var/lib/convergent/out/wan}
