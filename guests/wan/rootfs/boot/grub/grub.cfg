# Convergent wan: boot the one kernel at once, nothing to choose or edit.
# The regulatory country rides on the kernel command line (cfg80211 reads it before iwlwifi).
set timeout=0
set default=0
menuentry "wan" {
	linux /boot/vmlinuz-lts root=UUID=@ROOT_UUID@ rootfstype=ext4 ro quiet console=ttyS0 ipv6.disable=1 cfg80211.ieee80211_regdom=@WAN_COUNTRY@ init_on_alloc=1 slab_nomerge randomize_kstack_offset=on vsyscall=none audit=0
	initrd /boot/initramfs-lts
}
