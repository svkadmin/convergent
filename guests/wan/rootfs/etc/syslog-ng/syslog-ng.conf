@version: 4.11
# ARCHITECTURE 4.2, 8; svc's CA comes from the seed (wan-seed).
options {
	use-fqdn(no);
	stats(freq(0));
	time-reopen(10);
};

source s_local {
	unix-dgram("/dev/log");
	internal();
	file("/proc/kmsg" program-override("kernel") flags(kernel));
};

destination d_svc {
	syslog("100.80.2.10"
		port(6514)
		transport("tls")
		localip("100.80.0.10")
		tls(ca-file("/etc/syslog-ng/svc-ca.pem") peer-verify(required-trusted))
		log-fifo-size(2000)
	);
};

log { source(s_local); destination(d_svc); };
