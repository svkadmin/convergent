@version: 4.11
# ARCHITECTURE 4.2, 8; svc's CA comes from the seed (wan-seed).
options {
	use-fqdn(no);
	stats(freq(0));
	time-reopen(10);
};

source s_local {
	unix-dgram("/dev/log");
	internal();
	file("/proc/kmsg" program-override("kernel") flags(kernel));
};

destination d_svc {
	syslog("100.80.2.10"
		port(6514)
		transport("tls")
		localip("100.80.0.10")
		tls(ca-file("/etc/syslog-ng/svc-ca.pem") peer-verify(required-trusted))
		# svc outages wait on disk, 32 MiB on this small root.
		disk-buffer(reliable(no) mem-buf-length(2000) disk-buf-size(33554432) dir("/var/lib/syslog-ng"))
	);
};

filter f_diag {
	level(warn..emerg) or program("^(kernel|iwd|udhcpc|dhcpcd|chronyd)$");
};
destination d_diag {
	file("/var/log/wan/diag.log"
		create-dirs(yes) dir-owner("root") dir-group("root") dir-perm(0700)
		owner("root") group("root") perm(0600)
		logrotate(enable(yes) size(262144) rotations(1))
	);
};

log { source(s_local); filter(f_diag); destination(d_diag); };
log { source(s_local); destination(d_svc); };
