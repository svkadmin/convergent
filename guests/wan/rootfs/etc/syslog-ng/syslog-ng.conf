@version: 4.0
# Convergent wan: every record goes to svc over TLS (ARCHITECTURE sections 4.2 and 8) and
# nowhere else; nothing is kept on this disk. svc's CA is placed here by the build.
# The overlap alert and portal changes carry the fixed program names convergent-alert and
# wan-portal, which svc's alert rules match.
options {
	use-fqdn(no);
	stats(freq(0));
	time-reopen(10);
};

source s_local {
	unix-dgram("/dev/log");
	internal();
	file("/proc/kmsg" program-override("kernel") flags(kernel));
};

destination d_svc {
	syslog("100.80.2.10"
		port(6514)
		transport("tls")
		local-ip("100.80.0.10")
		tls(ca-file("/etc/syslog-ng/svc-ca.pem") peer-verify(required-trusted))
		log-fifo-size(2000)
	);
};

log { source(s_local); destination(d_svc); };
