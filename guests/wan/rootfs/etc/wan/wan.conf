# Convergent wan: the few values the scripts share (ARCHITECTURE sections 3.2 and 4.1).
# /etc/nftables.nft, /etc/network/interfaces, sshd_config and the node-exporter arguments carry
# the same addresses as plain text; the build refuses an image where INTERNAL_NET disagrees.
TRANSIT_IF=eth0
TRANSIT_ADDR=100.80.0.10
INTERNAL_NET=100.80.0.0/16
# Upstream interfaces: the radio, and an optional USB uplink adapter passed in by the host.
WIFI_IF=wlan0
UP_IFS="wlan0 eth1"
# The one browser allowed to use captive-portal DNS, and how long portal mode may last.
PORTAL_BROWSER=100.80.3.11
PORTAL_MAX_MIN=30
