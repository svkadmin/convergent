# Convergent wan: time from the host's clock (ARCHITECTURE section 3.2).
# The PTP device of the KVM guest is the only source, and chrony opens no network port at all.
refclock PHC /dev/ptp0 poll 2 refid KVM
driftfile /var/lib/chrony/drift
# Step in the first three updates (a stale clock at boot); slew afterwards.
makestep 1.0 3
port 0
cmdport 0
