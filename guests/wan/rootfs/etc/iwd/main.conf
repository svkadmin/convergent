# ARCHITECTURE 3.2
[General]
# iwd supplies DHCP; never enable SendHostname in network files.
EnableNetworkConfiguration=true
# A new random MAC address per network, all six bytes.
AddressRandomization=network
AddressRandomizationRange=full
# Protected management frames wherever the network offers them.
ManagementFrameProtection=1
# No Hotspot 2.0 queries to networks that are not ours.
DisableANQP=true

[Network]
EnableIPv6=false
# Shim records portal DNS and triggers the overlap check.
NameResolvingService=resolvconf

[DriverQuirks]
# Keep the kernel's wlan0: an interface iwd creates is named after its wiphy, so wlan1 after a driver reprobe.
# The per-network MAC is set at each connection either way.
DefaultInterface=*
