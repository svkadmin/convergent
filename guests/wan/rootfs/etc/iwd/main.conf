# Convergent wan: iwd (ARCHITECTURE section 3.2).
[General]
# iwd does DHCP itself, on every association, so a roam between networks is handled. Its client
# sends no host name: that needs [IPv4] SendHostname in a network's own file, never set here.
EnableNetworkConfiguration=true
# A new random MAC address per network, all six bytes.
AddressRandomization=network
AddressRandomizationRange=full
# Protected management frames wherever the network offers them.
ManagementFrameProtection=1
# No Hotspot 2.0 queries to networks that are not ours.
DisableANQP=true

[Network]
EnableIPv6=false
# iwd hands the lease's DNS servers to /usr/sbin/resolvconf, our shim: it records them for
# captive-portal mode and starts the overlap check. wan itself resolves nothing.
NameResolvingService=resolvconf
