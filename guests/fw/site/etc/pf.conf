# ARCHITECTURE 3.3, 4.2; same ruleset on both nodes.

if_transit = "vio0"
if_sync    = "vio1"
if_host    = "vio2"
if_svc     = "vio3"
if_web     = "vio4"
if_admin   = "vio5"
if_guests  = "vio6"
all_if     = "{ vio0 vio1 vio2 vio3 vio4 vio5 vio6 vio7 vlan320 vlan330 vlan360 vlan370 }"
carp_if    = "{ vio0 vio2 vio3 vio4 vio5 vio6 vlan320 vlan330 vlan360 vlan370 }"

# ARCHITECTURE 4.1
net_host   = "@NET@.1.0/28"
net_svc    = "@NET@.2.0/28"
net_web    = "@NET@.3.0/24"
net_admin  = "@NET@.4.0/28"
net_guests = "@NET@.8.0/22"

# Gateway and resolver addresses (CARP).
gw_host    = "@NET@.1.1"
gw_svc     = "@NET@.2.1"
gw_web     = "@NET@.3.1"
gw_admin   = "@NET@.4.1"
gw_guests  = "@NET@.8.1"

# Members.
a_wan      = "@NET@.0.10"
a_host     = "@NET@.1.10"
a_svc      = "@NET@.2.10"
a_portal   = "@NET@.3.11"
a_remmina  = "@NET@.3.12"
a_webbr    = "{ @NET@.3.10, @NET@.3.20 - @NET@.3.99 }"
a_admin    = "@NET@.4.10"

sync_addrs = "{ @NET@.0.17, @NET@.0.18 }"

# DoT forwarders. Keep in step with forward-zone in unbound.conf.
dot_fwd    = "{ 9.9.9.9, 149.112.112.112, 1.1.1.1, 1.0.0.1 }"

# Work tables.
table <work_nets> const { @WORK_NETS@ }
table <work_infra> const { @WORK_INFRA@ }
# A table, not a list: lists multiply out (10 interfaces x 24 x 24 CARP rules made pfctl take minutes).
table <fw_addrs> const { @NET@.0.2, @NET@.0.3, @NET@.1.2, @NET@.1.3, @NET@.2.2, @NET@.2.3, @NET@.3.2, @NET@.3.3, @NET@.4.2, @NET@.4.3, @NET@.8.2, @NET@.8.3, @WORK_INFRA@ }
table <work_dev> const { @WORK_DEV@ }
table <work_jhn> const { @WORK_JHN@ }
table <home_lan> const { @HOME_LAN@ }

table <nonpublic> const { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, \
	172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, \
	198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/3 }

# Host-managed tables; closing portal mode also kills its states both ways.
table <portal_dns>    persist
table <portal_lan>    persist
table <print_lan>     persist
table <blocklist_src> persist
table <update_src>    persist

set skip on lo
set block-policy drop
set state-policy if-bound
set loginterface none
set limit { states 50000, src-nodes 10000, frags 1000 }
set syncookies adaptive (start 25%, end 12%)

# Normalise everything; clamp the MSS toward wan.
match in all scrub (random-id reassemble tcp)
match on $if_transit inet scrub (max-mss 1400)

# Default deny, and nothing IPv6.
block log all
block quick inet6 all

# Policy is enforced inbound; what an inbound rule passed may leave. The firewall's own
# traffic is untagged and has its own pass out rules.
match in all tag fwd
pass out inet tagged fwd keep state

# DHCP discovery precedes source validation; dhcpd also uses BPF.
pass in quick on { vlan320 vlan330 vlan360 vlan370 } inet proto udp from { 0.0.0.0, <work_nets> } port 68 to { 255.255.255.255, self } port 67 no state
pass out quick on { vlan320 vlan330 vlan360 vlan370 } inet proto udp from self port 67 to { 255.255.255.255, <work_nets> } port 68 no state
pass out quick on { vlan320 vlan330 vlan360 vlan370 } inet proto icmp from self to <work_nets> icmp-type echoreq keep state

antispoof log quick for $all_if
block in log quick from urpf-failed

pass quick on $carp_if inet proto carp from <fw_addrs> to <fw_addrs> no state
pass quick on $if_sync inet proto pfsync from $sync_addrs to $sync_addrs no state
pass quick on $if_sync inet proto udp from $sync_addrs to $sync_addrs port 8067 no state

# Remmina: numeric work destinations only, before the broad web DNS exception.
block in log quick on $if_web from $a_remmina to <work_infra>
pass in quick on $if_web inet proto tcp from $a_remmina to <work_nets> port { 22 3389 5900:5999 } keep state (source-track rule, max-src-states 200)
pass in quick on $if_web inet proto udp from $a_remmina to <work_nets> port 3389 keep state (source-track rule, max-src-states 100)
pass in quick on $if_web inet proto icmp from $a_remmina to <work_nets> icmp-type echoreq keep state
block in log quick on $if_web from $a_remmina
# End Remmina.

# Each limit counts its own rule's states; pf's default (global) pools a source's DNS, SSH and query states.
pass in on $if_host   inet proto { udp tcp } from $net_host   to $gw_host   port 53 keep state (source-track rule, max-src-states 200)
pass in on $if_svc    inet proto { udp tcp } from $net_svc    to $gw_svc    port 53 keep state (source-track rule, max-src-states 200)
pass in on $if_web    inet proto { udp tcp } from $net_web    to $gw_web    port 53 keep state (source-track rule, max-src-states 400)
pass in on $if_admin  inet proto { udp tcp } from $net_admin  to $gw_admin  port 53 keep state (source-track rule, max-src-states 200)
pass in on $if_guests inet proto { udp tcp } from $net_guests to $gw_guests port 53 keep state (source-track rule, max-src-states 400)

# host
pass in on $if_host inet proto udp from $a_host to ! <nonpublic> port 123 keep state (source-track rule, max-src-states 20)
pass in on $if_host inet proto tcp from $a_host to ! <nonpublic> port 4460 keep state (source-track rule, max-src-states 20)
pass in on $if_host inet proto tcp from $a_host to <update_src> port 443 keep state (source-track rule, max-src-states 20) label "update"
pass in on $if_host inet proto tcp from $a_host to <blocklist_src> port 443 keep state (source-track rule, max-src-states 20) label "blocklist"
pass in on $if_host inet proto tcp from $a_host to $a_svc port { 6514 8880 9428 } keep state (source-track rule, max-src-states 50)
pass in on $if_host inet proto tcp from $a_host to (vio2) port 22 keep state (source-track rule, max-src-states 100)
pass in on $if_host inet proto tcp from $a_host to $a_wan port 22 keep state (source-track rule, max-src-states 100)

pass out on $if_host    inet proto udp from (vio2) to $a_host port 123 keep state
pass out on $if_transit inet proto tcp from (vio0) to $dot_fwd port 853 keep state (source-track rule, max-src-states 200)
pass out on $if_svc     inet proto tcp from (vio3) to $a_svc port 6514 keep state
pass out on $if_transit inet proto icmp from (vio0) to $a_wan icmp-type echoreq keep state

# svc: metrics scrape, and instance state from the host's Incus
pass in on $if_svc inet proto tcp from $a_svc to { $a_host, $a_wan } port 9100 keep state (source-track rule, max-src-states 20)
pass in on $if_svc inet proto tcp from $a_svc to (vio3) port 9100 keep state (source-track rule, max-src-states 10)
pass in on $if_svc inet proto tcp from $a_svc to $a_host port 8444 keep state (source-track rule, max-src-states 20)

# wan: nothing it starts, except syslog to svc
pass in on $if_transit inet proto tcp from $a_wan to $a_svc port 6514 keep state (source-track rule, max-src-states 20)

# web (def, tmp): browsing; printing only while the table is filled
pass in on $if_web inet proto { tcp udp } from $a_webbr to ! <nonpublic> port { 80 443 } keep state (source-track rule, max-src-states 4000)
pass in on $if_web inet proto tcp from $a_webbr to <print_lan> port 631 keep state (source-track rule, max-src-states 20)

# web (tmp --portal): only in portal mode, when the tables are filled
pass in on $if_web inet proto { udp tcp } from $a_portal to <portal_dns> port 53 keep state (source-track rule, max-src-states 100)
pass in on $if_web inet proto tcp from $a_portal to <portal_lan> port { 80 443 } keep state (source-track rule, max-src-states 100)

# admin (int): dashboards and full Incus administration
pass in on $if_admin inet proto tcp from $a_admin to $a_svc port 3000 keep state (source-track rule, max-src-states 100)
pass in on $if_admin inet proto tcp from $a_admin to $a_host port 8443 keep state (source-track rule, max-src-states 100)

# W1 work policy

# Per-guest overrides follow the default web policy.
pass in on $if_guests inet proto tcp from $net_guests to ! <nonpublic> port { 80 443 } keep state (source-track rule, max-src-states 1500)
include "/etc/convergent/pf.guests"
