# ARCHITECTURE 3.3, 4.1
# Reboot on panic; keep console input out of ddb.
ddb.panic=0
ddb.console=0
# rc.local enables forwarding after loading the final PF policy.
net.inet.ip.forwarding=0
net.inet.carp.preempt=1
# No redirects, no source routing, nothing IPv6 forwarded.
net.inet.ip.redirect=0
net.inet.ip.sourceroute=0
net.inet.icmp.rediraccept=0
net.inet6.ip6.forwarding=0
