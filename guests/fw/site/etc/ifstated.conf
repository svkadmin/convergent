# Demote every CARP address together while wan does not answer. The helper owns 128 of
# wanwatch's counter; kernel demotions in that group are left alone. Its record survives
# ifstated restarts, and a failed adjustment is retried by the next probe.
# One ping with a one-second deadline every two seconds must finish before the next test.
wan_ok = '"exec /usr/local/libexec/convergent/wan-watch @NET@.0.10" every 2'

init-state wan_up

state wan_up {
	if ! $wan_ok {
		set-state wan_down
	}
}

state wan_down {
	if $wan_ok {
		set-state wan_up
	}
}
