# ARCHITECTURE 3.3, 4.5

server:
	extended-statistics: yes
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	port: 53
	interface: 127.0.0.1
	interface: @NET@.1.1
	interface: @NET@.2.1
	interface: @NET@.3.1
	interface: @NET@.4.1
	interface: @NET@.8.1

	# Internal segments only; everything else is refused.
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: @NET@.1.0/28 allow
	access-control: @NET@.2.0/28 allow
	access-control: @NET@.3.0/24 allow
	access-control: @NET@.4.0/28 allow
	access-control: @NET@.8.0/22 allow

	# Hardening.
	hide-identity: yes
	hide-version: yes
	hide-trustanchor: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-referral-path: yes
	harden-algo-downgrade: no
	harden-below-nxdomain: yes
	harden-short-bufsize: yes
	harden-large-queries: yes
	use-caps-for-id: no
	aggressive-nsec: yes
	minimal-responses: yes
	qname-minimisation: yes
	rrset-roundrobin: yes
	unwanted-reply-threshold: 1000000
	val-clean-additional: yes
	val-log-level: 1
	edns-buffer-size: 1232
	max-udp-size: 1232
	ip-ratelimit: 300
	incoming-num-tcp: 50
	tcp-idle-timeout: 5000
	# Reject private upstream answers.
	private-address: 0.0.0.0/8
	private-address: 10.0.0.0/8
	private-address: 100.64.0.0/10
	private-address: 127.0.0.0/8
	private-address: 169.254.0.0/16
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: ::ffff:0:0/96

	# Small: one thread, caches that leave room for the blocklist and the boot-time kernel relink.
	num-threads: 1
	msg-cache-slabs: 1
	rrset-cache-slabs: 1
	infra-cache-slabs: 1
	key-cache-slabs: 1
	msg-cache-size: 16m
	rrset-cache-size: 32m
	prefetch: yes
	prefetch-key: yes

	# DNSSEC trust anchor, maintained by RFC 5011.
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	tls-cert-bundle: "/etc/ssl/cert.pem"
	module-config: "respip validator iterator"

	# Deny the DoH canary.
	local-zone: "use-application-dns.net." always_nxdomain

	# Built-in names and pushed owner records.
	include: "/var/unbound/etc/local-names.conf"
	include: "/var/unbound/etc/local-owner.conf"

# RPZ includes owner passthrough exceptions; validate before replacing.
rpz:
	name: "blocklist.rpz."
	zonefile: "/var/unbound/etc/blocklist.rpz"
	rpz-log: yes
	rpz-log-name: "blocklist"

# Resolution: DNS over TLS, forwarders by address and certificate name.
forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 9.9.9.9@853#dns.quad9.net
	forward-addr: 149.112.112.112@853#dns.quad9.net
	forward-addr: 1.1.1.1@853#cloudflare-dns.com
	forward-addr: 1.0.0.1@853#cloudflare-dns.com

remote-control:
	control-enable: yes
	control-use-cert: no
	control-interface: /var/run/unbound.sock
