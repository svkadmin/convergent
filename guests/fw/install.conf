# autoinstall(8) response file for fw1 and fw2. The build host serves it as <node>-install.conf
# with the marked values (between at signs) filled in; the network is the installer's own
# (QEMU user-net), the final interfaces come from the site set.
System hostname = @HOSTNAME@
DNS domain name = @DOMAIN@
Password for root = *************
Allow root ssh login = prohibit-password
Public ssh key for root account = @ROOT_SSH_KEY@
Start sshd(8) by default = yes
Setup a user = no
Do you expect to run the X Window System = no
Change the default console to com0 = yes
Which speed should com0 use = 115200
What timezone are you in = UTC
IPv6 address for vio0 = none

# One virtio disk; GPT with an EFI system partition, as Incus boots the VM with UEFI.
Which disk is the root disk = sd0
Encrypt the root disk with a passphrase = no
Use (W)hole disk MBR, whole disk (G)PT, (O)penBSD area or (E)dit = gpt
Use (A)uto layout, (E)dit auto layout, or create (C)ustom layout = a

# Sets from the build host over the installer's network. No X, compilers, games, man pages
# or the install kernel; the site set is picked up on its own. The build host has verified the
# sets' signature; site sets are not signed by OpenBSD, so the installer asks about them.
Location of sets = http
HTTP proxy URL = none
HTTP Server = 10.0.2.2
Server directory = sets
Unable to connect using https. Use http instead = yes
Set name(s) = -x* -comp* -game* -man* -bsd.rd
Continue without verification = yes
