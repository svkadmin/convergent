# Apply after browser-base; init --ephemeral, stop on close/failure.
config:
  environment.BROWSER_ROLE: "tmp"
  environment.BROWSER_IPV4: "100.80.3.20"
  security.protection.delete: "false"
  limits.memory: 2GiB
description: tmp browser
devices:
  eth0:
    type: nic
    nictype: bridged
    parent: web
    name: eth0
    hwaddr: "00:16:3e:80:03:20"
    ipv4.address: 100.80.3.20
    security.ipv4_filtering: "true"
    security.mac_filtering: "true"
    security.port_isolation: "true"
  wayland:
    type: disk
    source: /run/convergent/browser/tmp/sockets/wayland-0
    path: /mnt/browser/wayland-0
    readonly: "true"
    # browser sets the real socket and required=true on the instance; at creation it does not exist yet.
    required: "false"
  pipewire:
    type: disk
    source: /run/convergent/browser/tmp/sockets/pulse-0
    path: /mnt/browser/pipewire-0
    readonly: "true"
    required: "false"
