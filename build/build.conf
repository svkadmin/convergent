# Release build pins and paths.

# Semantic version: bump per release (major.minor.patch, optionally -rcN).
VERSION=0.1.7

# Signed Gentoo stage3.
STAGE3_VARIANT=hardened-openrc
STAGE3_BUILD=20261011T170049Z
# Update with STAGE3_BUILD; empty refuses a new bootstrap.
STAGE3_SHA256=11a86c89b92e3eb1dd75cfb70cb294496e2298a910c75fc80e526b4fa84fe065

# Signed Portage snapshot.
SNAPSHOT_DATE=20261107

# Builder and laptop profile.
PROFILE=default/linux/amd64/23.0/hardened

# Where the builder lives on the build host.
BUILDER=/var/lib/convergent/builder

# Early microcode: Arrow Lake H/HX/U and Lunar Lake; no server or legacy CPUs.
MICROCODE_KEEP="06-c5-02 06-c6-02 06-b5-00 06-bd-01"

# Arrow Lake uses MTL GuC/HuC/GSC and DMC. Keep versioned targets too.
I915_FIRMWARE="i915/mtl_ i915/arl_"
# IPU/SOF need the owner's camera/audio IDs before narrowing. Keep host Bluetooth and Ethernet.
FIRMWARE_KEEP="$I915_FIRMWARE intel/sof intel/ibt- intel/ish/ intel/ipu/ intel/vsc/ cirrus/ cs42l43.bin rtl_nic/"

# Paths below lib/modules/<version>/kernel; shell patterns, one reason per class.
MODULE_DROP="
 drivers/net/wireless/* drivers/staging/rtl*/* net/mac80211/* net/wireless/* # Wi-Fi belongs to wan.
 drivers/net/ethernet/* # Keep Intel/Realtek below.
 drivers/net/usb/* # USB NICs belong to wan (Incus passthrough); a host driver would claim them.
 drivers/gpu/drm/amd/* drivers/gpu/drm/radeon/* drivers/gpu/drm/xe/* drivers/gpu/drm/nouveau/* # i915 and vfio only.
 drivers/scsi/* # Keep disk/USB/virtio support below; no HBAs.
 drivers/infiniband/* # No RDMA hardware.
 drivers/media/* drivers/staging/media/* # Keep UVC, Intel cameras and their shared support below.
 fs/ocfs2/* fs/gfs2/* fs/ceph/* fs/cifs/* fs/smb/* fs/nfs/* fs/nfsd/* fs/f2fs/* fs/ubifs/* # Unused filesystems.
 drivers/md/dm-vdo/* drivers/block/drbd/* # No VDO or DRBD volumes.
"
MODULE_KEEP="
 drivers/usb/serial/usbserial.ko* drivers/usb/serial/ftdi_sio.ko* drivers/usb/serial/cp210x.ko*
 drivers/usb/serial/pl2303.ko* drivers/usb/serial/ch341.ko* drivers/usb/class/cdc-acm.ko*
 drivers/net/ethernet/intel/* drivers/net/ethernet/realtek/*
 drivers/scsi/scsi_mod.ko* drivers/scsi/scsi_common.ko* drivers/scsi/sd_mod.ko*
 drivers/scsi/sg.ko* drivers/scsi/sr_mod.ko* drivers/scsi/virtio_scsi.ko*
 drivers/media/usb/uvc/* drivers/media/pci/intel/* drivers/media/platform/intel/*
 drivers/media/i2c/* drivers/media/v4l2-core/* drivers/media/mc/* drivers/media/common/videobuf2/*
 drivers/staging/media/ipu*/* drivers/staging/media/atomisp/*
"
# Unused multilib glibc and SPIR-V tools (mesa links libSPIRV-Tools.so); ldd gate checks the rest.
IMAGE_DROP="
 usr/lib/ld-linux.so.2 usr/lib/ld-*.so usr/lib/libc.so* usr/lib/libc-*.so
 usr/lib/libm.so* usr/lib/libm-*.so usr/lib/libmvec* usr/lib/libpthread*
 usr/lib/libdl* usr/lib/librt* usr/lib/libresolv* usr/lib/libnss_* usr/lib/libutil*
 usr/lib/libanl* usr/lib/libBrokenLocale* usr/lib/gconv usr/lib/misc/glibc/getconf/*_ILP32_*
 usr/bin/spirv-* usr/lib64/libSPIRV-Tools-* usr/lib/libSPIRV-Tools-* usr/share/spirv-tools
"

# PCI IDs vfio-pci claims at boot, before other drivers: the Dell Pro Max 14's NVIDIA GPU, its
# HDMI audio and its Wi-Fi radio (wan's; otherwise driverless whenever wan is stopped).
# host-net still binds other NVIDIA functions later.
VFIO_IDS=10de:2db8,10de:22ec,8086:7740

# Update channel. Build host files: /etc/convergent/keys/<channel>.pub (laptops trust it),
# <channel>.key (signs; the stable key stays offline) and r2-<channel>.env (the bucket).
# CHANNEL may be overridden in the environment.
CHANNEL=${CHANNEL:-beta}
