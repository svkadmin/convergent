# Convergent: what a release is built from. Changing a pin is a deliberate, reviewed act.

# Gentoo stage3 for the builder: variant and the exact build, verified by Gentoo's release key.
STAGE3_VARIANT=hardened-openrc
STAGE3_BUILD=20261011T170049Z

# Portage tree snapshot, by date, verified by Gentoo's snapshot signature.
SNAPSHOT_DATE=20261014

# Profile for the builder and for the laptop.
PROFILE=default/linux/amd64/23.0/hardened

# Where the builder lives on the build host.
BUILDER=/var/lib/convergent/builder
