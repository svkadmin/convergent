# ARCHITECTURE 8; bounded reliable disk buffer while svc is unavailable.
destination d_svc {
    syslog("100.80.2.10" port(6514) transport("tls")
        tls(ca-file("/var/lib/convergent/guests/tls/ca.crt") peer-verify(required-trusted))
        disk-buffer(reliable(yes) disk-buf-size(67108864) mem-buf-size(1048576)
            dir("/var/lib/syslog-ng")));
};
log { source(s_local); destination(d_svc); };
