@version: 4.10
# Convergent host: the system log in /var/log/messages and, once svc exists, to svc over TLS
# (ARCHITECTURE sections 4.2 and 8). The svc destination, with svc's CA, is written by the
# guests tool into /var/lib/convergent/syslog-ng.d; until then the log stays here.
options {
	use-fqdn(no);
	stats(freq(0));
	time-reopen(10);
};

source s_local {
	system();
	internal();
};

destination d_messages {
	file("/var/log/messages" perm(0600));
};

log { source(s_local); destination(d_messages); };

@include "/var/lib/convergent/syslog-ng.d/*.conf"
