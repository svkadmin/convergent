@version: 4.10
# ARCHITECTURE 8; inject svc's CA before forwarding.
options {
	use-fqdn(no);
	stats(freq(0));
	time-reopen(10);
};

# system() spelled out, to turn off SO_PASSCRED: the per-message sender lookups in /proc are partly
# denied by AppArmor (ptrace on exe), and every denial is an audit event that comes back here.
source s_local {
	unix-dgram("/dev/log" so-passcred(no));
	file("/dev/kmsg" program-override("kernel") flags(kernel) format("linux-kmsg"));
	internal();
};

destination d_messages {
	file("/var/log/messages" perm(0600));
};

# Keep low-priority security events locally too, including when svc is down.
log {
	source(s_local);
	filter {
		level(warn..emerg) or (facility(auth, authpriv) and not program("^(crond|CROND)$")) or
		program("^(greetd|tuigreet|login|su|sudo|usbguard(-daemon)?|slot|fetch-release|guests|incus-ui|convergent-watchdog|sys-firewall)$");
	};
	destination(d_messages);
};

# While svc is unavailable records wait on disk (256 MiB; beyond that new ones are dropped);
# warnings and local security events stay in d_messages either way.
destination d_svc {
	syslog("100.80.2.10" port(6514) transport("tls")
		tls(ca-dir("/var/lib/convergent/syslog-ca") peer-verify(required-trusted))
		disk-buffer(reliable(no) mem-buf-length(10000) disk-buf-size(268435456) dir("/var/lib/syslog-ng")));
};
log { source(s_local); destination(d_svc); };

# Only selected event fields leave this loopback-only input; never forward raw payloads.
source s_incus { network(ip("127.0.0.1") port(1514) transport("udp")); };
# Incus sends "type: <type> log: <event metadata JSON>".
parser p_incus_lifecycle { json-parser(marker("type: lifecycle log: ") prefix(".incus.metadata.")); };
parser p_incus_request { json-parser(marker("type: logging log: ") prefix(".incus.metadata.")); };
rewrite r_incus_path {
	subst("[?].*$", "", value(".incus.metadata.source"));
	subst("[?].*$", "", value(".incus.metadata.context.url"));
	set("incus-audit", value("PROGRAM"));
};
rewrite r_incus_lifecycle {
	set("$(format-json --scope none event=lifecycle identity=${.incus.metadata.requestor.username} protocol=${.incus.metadata.requestor.protocol} action=${.incus.metadata.action} resource=${.incus.metadata.source})", value("MESSAGE"));
};
rewrite r_incus_request {
	set("$(format-json --scope none event=request identity=${.incus.metadata.context.username} protocol=${.incus.metadata.context.protocol} method=${.incus.metadata.context.method} path=${.incus.metadata.context.url})", value("MESSAGE"));
};
log {
	source(s_incus); parser(p_incus_lifecycle);
	rewrite(r_incus_path); rewrite(r_incus_lifecycle);
	destination(d_messages); destination(d_svc);
};
# Local reads (the minute probes) are not shipped; every change, TLS request and lifecycle event is.
log {
	source(s_incus); parser(p_incus_request);
	filter {
		match("^Handling API request$" value(".incus.metadata.message")) and
		not (match("^GET$" value(".incus.metadata.context.method")) and match("^unix$" value(".incus.metadata.context.protocol")));
	};
	rewrite(r_incus_path); rewrite(r_incus_request);
	destination(d_messages); destination(d_svc);
};
