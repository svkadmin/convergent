# Convergent: time over NTS only (ARCHITECTURE section 3.1). An unauthenticated source could
# move TLS and DNSSEC validity, so there is none. Two of three sources must agree.
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
server ntppool1.time.nl iburst nts
minsources 2

# Cookies survive a restart, so a reboot needs no fresh key exchange.
ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/drift

# Step only in the first three updates (a stale clock at boot); slew afterwards.
makestep 1.0 3
rtcsync
leapseclist /usr/share/zoneinfo/leap-seconds.list

# Serve time to the firewall pair on the host's own segment, and to nobody else.
allow 100.80.1.2
allow 100.80.1.3
bindaddress 100.80.1.10
bindcmdaddress 127.0.0.1
