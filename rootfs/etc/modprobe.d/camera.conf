# State is mounted before host device probing; an absent choice denies loading.
# Gate the shared video core as well as each retained camera controller.
install videodev /usr/local/sbin/devices camera load videodev
install uvcvideo /usr/local/sbin/devices camera load uvcvideo
install intel_ipu6 /usr/local/sbin/devices camera load intel_ipu6
install intel_ipu6_isys /usr/local/sbin/devices camera load intel_ipu6_isys
install ipu3_cio2 /usr/local/sbin/devices camera load ipu3_cio2
install ipu3_imgu /usr/local/sbin/devices camera load ipu3_imgu
install atomisp /usr/local/sbin/devices camera load atomisp
