# Build configuration; buildenv writes parallelism to 90-local.

COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Wayland/PipeWire; no X11 or desktop environments.
USE="-X -systemd -gnome -kde -qt5 -qt6 -gtk -gtk-doc -doc -examples -test -introspection wayland pipewire"

VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS=""
L10N="en"

# Exceptions belong in package.license.
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# Verify binary packages; cache local builds.
FEATURES="buildpkg binpkg-request-signature parallel-fetch"
# Build the kernel from source with this repository's fragment.
EMERGE_DEFAULT_OPTS="--usepkg --getbinpkg --binpkg-respect-use=y --with-bdeps=y
	--usepkg-exclude=sys-kernel/gentoo-kernel --buildpkg-exclude=sys-kernel/gentoo-kernel"

LC_MESSAGES=C.UTF-8
