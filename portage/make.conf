# Convergent: Portage settings for the release build.
# Installed in the builder as /etc/portage/make.conf/10-convergent; the build host's own
# parallelism goes in /etc/portage/make.conf/90-local, written by build/buildenv.

COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# No X11, no systemd, no desktop environments, no GObject introspection: Wayland and PipeWire only.
USE="-X -systemd -gnome -kde -qt5 -qt6 -gtk -gtk-doc -doc -examples -test -introspection wayland pipewire"

VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS=""
L10N="en"

# Free software and redistributable firmware; anything else is named in package.license.
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# Gentoo's signed hardened binary packages first; everything built here becomes a binary
# package too, so a release can be rebuilt without compiling again.
FEATURES="buildpkg binpkg-request-signature parallel-fetch"
EMERGE_DEFAULT_OPTS="--usepkg --getbinpkg --binpkg-respect-use=y --with-bdeps=y"

LC_MESSAGES=C.UTF-8
