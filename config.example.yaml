# Build/install input only; no passwords, hashes, keys or secrets, even in comments.
# Version/channel: build/build.conf (default channel beta); dev is unpublished, stable promotes unchanged.
# All keys are optional; values below are defaults, except xkb_layouts (default us).
# Unknown/duplicate keys are errors.
# Scalars only, optionally double-quoted; install children use exactly two spaces.

# Host label: 1..63 lowercase letters/digits/hyphens, no edge hyphens.
hostname: host
# Installed zoneinfo name: letters, _, +, -, and slash-separated components with digits.
timezone: UTC
# Installed console keymap: letters/digits/_, +, -; the LUKS prompt stays US.
console_keymap: us
# Comma-separated 2..3 lowercase-letter layouts; optional (lowercase/digits/_/- variant).
xkb_layouts: us,sk(qwerty),ru
# Empty or 0.5..4, at most two decimals; empty: 1.3 on the laptop panel, 1 on external screens.
display_scale: ""
# Empty or two uppercase letters; a WAN build requires this or WAN_COUNTRY.
wifi_country: ""
# Comma-separated DNS names (labels 1..63, names <=253 chars), at least two distinct.
nts_servers: time.cloudflare.com,ptbtime1.ptb.de,ntppool1.time.nl
# HTTPS URL: lowercase DNS host; path/query chars letters/digits and ._~/%?=&+,-.
# No credentials, port, fragment or secret query parameters.
blocklist_url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/pro.mini.txt
# CPU ceiling in kHz: 0 (none) or an integer 100000..99999999, no leading zeros.
cpu_cap_khz: 0
# Idle minutes before locking: integer 1..60.
idle_lock_minutes: 10
# Login: 1..32 lowercase letters/digits/_/-, starts with letter or _.
# Omit to prompt; CONVERGENT_INSTALL_OWNER overrides. Password always prompted.
owner_login: owner
# Stick image GiB: 1G..99999G; must fit the layout. Positional build/stick size overrides.
image_size: 30G

# Work names: 1..32 lowercase letters/digits/hyphens, starts with a letter, no trailing hyphen.
# Four distinct canonical 100.80.N.0/26 prefixes; N=5..7 or 12..255 avoids system segments.
# Static .1-.48, fw1 .49, fw2 .50, DHCP .51-.61, CARP gateway/DNS .62.
work_dev_name: dom-dev
work_dev_prefix_a: 100.80.32.0/26
work_dev_prefix_b: 100.80.33.0/26
work_jhn_name: dom-jhn
work_jhn_prefix_a: 100.80.36.0/26
work_jhn_prefix_b: 100.80.37.0/26
# Canonical RFC1918 CIDRs, comma separated; empty closes access to home LANs.
home_lan_prefixes: ""

# Mandatory GPT ESP + A/B slots + LUKS2/Btrfs state; no encryption/topology switches.
# Release fixes ESP at 1024 MiB and each slot at 8192 MiB.
install:
  # auto: exactly one nonremovable, non-hotplug internal NVMe/SATA/ATA SSD, excluding boot disk.
  # Or /dev/disk/by-id/<whole-disk-id>; no slash in ID, no -partN suffix.
  # ID starts with letter/digit/_; remaining chars letters/digits/_.:+-.
  # Explicit targets still reject boot disks, mounts, active swap, holders and read-only disks.
  # build/stick always targets its loop image; this key selects a physical install target.
  disk: auto
  # auto: all remaining space, grows after copying to a larger disk.
  # 1%..100%: whole percentage of space after ESP, slots and GPT/alignment.
  # 32GiB..999999GiB: whole GiB. Percent/GiB sizes stay fixed after installation.
  # Must fit, leaving >=32 GiB state (>=12 GiB on build media) plus any state swap.
  # build/stick forces auto state; enlarge image_size to fit state swap.
  state_size: auto
  # none, zram:1GiB..zram:1024GiB, or state:1GiB..state:1024GiB.
  # zram is logical uncompressed capacity; state is a swapfile inside encrypted state.
  # No hibernation; disk swap stays outside /var snapshots.
  swap: none
